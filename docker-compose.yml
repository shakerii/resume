services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/dev.db
    volumes:
      - resume-data:/app/data
    restart: always
    networks:
      - app_network

  certbot:
    profiles: ["cert"]
    image: certbot/certbot:v2.4.0
    volumes:
      - ./data/certbot/data:/var/www/certbot
      - ./data/certbot/certs:/etc/letsencrypt
    networks:
      - app_network
    command: >
      certonly
      --webroot
      --webroot-path /var/www/certbot
      --email r.shakeri1375@gmail.com
      --agree-tos
      --no-eff-email
      -d ramtinshakeri.com

  certbot-renew:
    profiles: ["renew"]
    image: certbot/certbot:v2.4.0
    volumes:
      - ./data/certbot/data:/var/www/certbot
      - ./data/certbot/certs:/etc/letsencrypt
    entrypoint: ["sh", "-c"]
    command: >
      certbot
      renew
      --webroot
      --webroot-path /var/www/certbot
    networks:
      - app_network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    entrypoint: ["/bin/sh", "/nginx-entrypoint.sh"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
      - ./data/certbot/data:/var/www/certbot
      - ./data/certbot/certs:/etc/letsencrypt
    networks:
      - app_network
    restart: always
    depends_on:
      - app

networks:
  app_network:

volumes:
  resume-data:
