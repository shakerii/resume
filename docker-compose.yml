services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    restart: always
    networks:
      - app_network

  certbot:
    image: certbot/certbot:v2.4.0
    volumes:
      - ./data/certbot/data:/var/www/certbot
      - ./data/certbot/certs:/etc/letsencrypt
    networks:
      - app_network
    command: >
      certonly
      --webroot
      --webroot-path /var/www/certbot
      --email r.shakeri1375@gmail.com
      --agree-tos
      --no-eff-email
      -d ramtin.dev

  certbot-renew:
    image: certbot/certbot:v2.4.0
    volumes:
      - ./data/certbot/data:/var/www/certbot
      - ./data/certbot/certs:/etc/letsencrypt
    entrypoint: ["sh", "-c"]
    command: >
      certbot
      renew
      --webroot
      --webroot-path /var/www/certbot
    networks:
      - app_network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./data/certbot/data:/var/www/certbot
      - ./data/certbot/certs:/etc/letsencrypt
    networks:
      - app_network
    restart: always

networks:
  app_network:
